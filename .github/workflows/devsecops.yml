name: Trust Gate CI

# Kick off on every push or PR to main — keeps things honest
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: trust-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRUSTGATE_SCANNER_TIMEOUT: "300"

jobs:
  dependency-pins:
    name: Verify immutable dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate dependency pins
        env:
          PYTHONPATH: src
        run: python scripts/verify_dependency_pins.py

  # --- Static Analysis: Bandit ---
  # Bandit reads through our Python source and flags anything that looks sketchy —
  # hardcoded passwords, dodgy subprocess calls, that sort of thing.
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: python -m pip install --require-hashes -r requirements/scanners.lock

      # This is what the gate sees — the project's own code, not the seeded fixture.
      - name: Run Bandit scan (project code)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner bandit \
            --report reports/bandit_report.json \
            --metadata reports/bandit_execution.json \
            --logs-dir reports/logs/bandit \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- bandit -r scripts/ -f json -o reports/bandit_report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: |
            reports/bandit_report.json
            reports/bandit_execution.json
            reports/logs/bandit/

      # benchmarks/fixtures/python/flask_vulnerable/ is a deliberately vulnerable
      # fixture used for the dissertation's
      # precision/recall research (docs/research/README.md) — informational only, never gates.
      - name: Run Bandit scan (seeded research fixture)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner bandit \
            --report reports/bandit_seeded_report.json \
            --metadata reports/bandit_seeded_execution.json \
            --logs-dir reports/logs/bandit-seeded \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- bandit -r benchmarks/fixtures/python/flask_vulnerable/ \
            -f json -o reports/bandit_seeded_report.json

      - name: Upload Bandit seeded-fixture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-seeded-report
          path: |
            reports/bandit_seeded_report.json
            reports/bandit_seeded_execution.json
            reports/logs/bandit-seeded/

  # --- Static Analysis: Semgrep ---
  # Semgrep is our second pair of eyes on the code — it catches patterns Bandit misses
  # and runs against a curated Python ruleset.
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --require-hashes -r requirements/scanners.lock

      # This is what the gate sees — the project's own code, not the seeded fixture.
      - name: Run Semgrep scan (project code)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner semgrep \
            --report reports/semgrep_report.json \
            --metadata reports/semgrep_execution.json \
            --logs-dir reports/logs/semgrep \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- semgrep --config=p/python --json \
            --output reports/semgrep_report.json \
            scripts/

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: |
            reports/semgrep_report.json
            reports/semgrep_execution.json
            reports/logs/semgrep/

      # benchmarks/fixtures/python/flask_vulnerable/ is a deliberately vulnerable
      # fixture used for the dissertation's
      # precision/recall research (docs/research/README.md) — informational only, never gates.
      - name: Run Semgrep scan (seeded research fixture)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner semgrep \
            --report reports/semgrep_seeded_report.json \
            --metadata reports/semgrep_seeded_execution.json \
            --logs-dir reports/logs/semgrep-seeded \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- semgrep --config=p/python --json \
            --output reports/semgrep_seeded_report.json \
            benchmarks/fixtures/python/flask_vulnerable/

      - name: Upload Semgrep seeded-fixture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-seeded-report
          path: |
            reports/semgrep_seeded_report.json
            reports/semgrep_seeded_execution.json
            reports/logs/semgrep-seeded/

  # --- Dynamic Analysis: OWASP ZAP ---
  # ZAP actually fires HTTP requests at the running app, so we spin Flask up first,
  # wait for it to be ready, then let ZAP loose on it. Think of it as a robot pentester.
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    env:
      DAST_TARGET: "http://localhost:5000"
      DAST_RULES_FILE: ".zap/rules.tsv"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate DAST target and rules file
        env:
          TRUSTGATE_DAST_URL: ${{ env.DAST_TARGET }}
          TRUSTGATE_DAST_RULES_FILE: ${{ env.DAST_RULES_FILE }}
        run: python scripts/validate_inputs.py dast --allow-private

      - name: Install Flask
        run: python -m pip install --require-hashes -r requirements/development.lock

      # Start Flask in the background and poll until it responds — avoids race conditions
      - name: Start Flask app
        run: |
          cd benchmarks/fixtures/python/flask_vulnerable
          nohup python app.py > /tmp/flask.log 2>&1 &
          echo "Waiting for Flask to start..."
          for i in {1..15}; do
            if curl -s "$DAST_TARGET" > /dev/null; then
              echo "Flask is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -v "$DAST_TARGET" || (cat /tmp/flask.log && exit 1)

      - name: Create reports directory
        run: mkdir -p reports

      - name: Start ZAP timing
        run: python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())' > reports/zap_started_at.txt

      # Baseline scan — not a full spider, but good enough to catch the obvious stuff
      - name: Run ZAP baseline scan
        id: zap
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ env.DAST_TARGET }}
          fail_action: false
          rules_file_name: ${{ env.DAST_RULES_FILE }}
          cmd_options: "-J zap_report.json"
        continue-on-error: true

      # ZAP drops its report in the workspace root, so we move it into reports/
      - name: Move ZAP report to reports folder
        if: always()
        run: |
          if [ -f zap_report.json ]; then
            mv zap_report.json reports/zap_report.json
            echo "ZAP report moved successfully"
          else
            echo "No ZAP report found; scanner health will record the failure."
          fi

      - name: Record ZAP health
        if: always()
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          python scripts/record_scanner.py \
            --scanner zap \
            --report reports/zap_report.json \
            --metadata reports/zap_execution.json \
            --started-at "$(cat reports/zap_started_at.txt)" \
            --outcome "$ZAP_OUTCOME" \
            --version action-0.12.0

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            reports/zap_report.json
            reports/zap_execution.json

  # --- Software Composition Analysis: pip-audit ---
  # Checks our Python dependencies against known CVEs. Catches the "we forgot to update
  # a library" class of vulnerability before it bites us in production.
  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --require-hashes -r requirements/scanners.lock

      # This is what the gate sees — the project's own dependencies, not the seeded fixture's.
      - name: Run pip-audit scan (project deps)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner pip-audit \
            --report reports/pip_audit_report.json \
            --metadata reports/pip-audit_execution.json \
            --logs-dir reports/logs/pip-audit \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- pip-audit -r requirements.txt --format json \
            -o reports/pip_audit_report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: |
            reports/pip_audit_report.json
            reports/pip-audit_execution.json
            reports/logs/pip-audit/

      # benchmarks/fixtures/python/flask_vulnerable/ is a deliberately vulnerable
      # fixture used for the dissertation's
      # precision/recall research (docs/research/README.md) — informational only, never gates.
      - name: Run pip-audit scan (seeded research fixture)
        continue-on-error: true
        run: |
          python scripts/run_scanner.py \
            --scanner pip-audit \
            --report reports/pip_audit_seeded_report.json \
            --metadata reports/pip-audit_seeded_execution.json \
            --logs-dir reports/logs/pip-audit-seeded \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            -- pip-audit \
            -r benchmarks/fixtures/python/flask_vulnerable/requirements.txt \
            --format json -o reports/pip_audit_seeded_report.json

      - name: Upload pip-audit seeded-fixture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-seeded-report
          path: |
            reports/pip_audit_seeded_report.json
            reports/pip-audit_seeded_execution.json
            reports/logs/pip-audit-seeded/

  # --- Container / IaC Scan: Trivy ---
  # Trivy looks at our Dockerfiles and config files for misconfigurations —
  # things like running as root, exposed ports, or missing health checks.
  container-scan-trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Start Trivy timing
        run: python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())' > trivy_started_at.txt

      - name: Run Trivy config scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: .
          format: json
          output: reports/trivy_report.json
          exit-code: "0"

      - name: Record Trivy health
        if: always()
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          python scripts/record_scanner.py \
            --scanner trivy \
            --report reports/trivy_report.json \
            --metadata reports/trivy_execution.json \
            --started-at "$(cat trivy_started_at.txt)" \
            --outcome "$TRIVY_OUTCOME" \
            --version 0.69.3

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-report
          path: |
            reports/trivy_report.json
            reports/trivy_execution.json

  # --- Secrets Scan: Gitleaks ---
  # Trawls the full git history for accidentally committed secrets — API keys, tokens,
  # passwords. fetch-depth: 0 is important here so we see every commit, not just HEAD.
  secrets-scan-gitleaks:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          # Gitleaks v8.30.1
          python scripts/run_scanner.py \
            --scanner gitleaks \
            --report reports/gitleaks_report.json \
            --metadata reports/gitleaks_execution.json \
            --logs-dir reports/logs/gitleaks \
            --timeout "$TRUSTGATE_SCANNER_TIMEOUT" \
            --finding-exit-code 3 \
            --version 8.30.1 \
            -- docker run --rm -v "$PWD":/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --report-format json \
            --report-path /repo/reports/gitleaks_report.json \
            --exit-code 3

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: |
            reports/gitleaks_report.json
            reports/gitleaks_execution.json
            reports/logs/gitleaks/

  # --- Security Gate ---
  # This is the decision point. Reports from the project's own code (not the
  # seeded benchmark fixture — that's research-only, see the *-seeded-report
  # artifacts) land here and get fed into aggregate_results.py, which counts
  # HIGH/CRITICAL findings. If the count is too high, the gate fails and the
  # build is blocked. Nothing ships until it's clean.
  security-gate:
    name: Trust Gate
    runs-on: ubuntu-latest
    needs: [sast-bandit, sast-semgrep, sca-pip-audit, container-scan-trivy, secrets-scan-gitleaks]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Bandit report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bandit-report
          path: reports/
        continue-on-error: true

      - name: Download Semgrep report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: semgrep-report
          path: reports/
        continue-on-error: true

      # A missing artifact remains visible: the download can continue, but required
      # execution metadata below makes the aggregate step fail closed.
      - name: Download pip-audit report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pip-audit-report
          path: reports/
        continue-on-error: true

      - name: Download Trivy report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trivy-report
          path: reports/
        continue-on-error: true

      - name: Download Gitleaks report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gitleaks-report
          path: reports/
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Trust Gate runtime dependencies
        run: python -m pip install --require-hashes -r requirements/runtime.lock

      # Run the aggregation script — it writes findings.json and exits non-zero on HIGH/CRITICAL
      - name: Run aggregation and security gate
        id: gate
        run: python scripts/aggregate_results.py --require-execution-metadata
        continue-on-error: true

      - name: Generate Trust Gate SARIF
        if: always()
        env:
          PYTHONPATH: src
        run: |
          if [ ! -f reports/findings.json ]; then
            echo "Canonical findings are unavailable; SARIF was not generated."
            exit 0
          fi
          python -m trustgate sarif \
            --input reports/findings.json \
            --output reports/trustgate.sarif

      - name: Publish Trust Gate Check summary
        if: always()
        env:
          PYTHONPATH: src
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          if [ -f reports/findings.json ] && [ -f reports/policy-result.json ]; then
            summary_args=()
            if [ -f reports/baseline-diff.json ]; then
              summary_args+=(--baseline-diff reports/baseline-diff.json)
            fi
            if [ -f reports/baseline-gate.json ]; then
              summary_args+=(--baseline-gate reports/baseline-gate.json)
            fi
            python -m trustgate checks \
              --input reports/findings.json \
              --policy-result reports/policy-result.json \
              --artifact-url "$ARTIFACT_URL" \
              --output reports/check-summary.md \
              "${summary_args[@]}"
          else
            {
              echo "# Trust Gate check"
              echo
              echo "**Release decision: ERROR**"
              echo
              echo "Canonical findings or policy output was unavailable. Inspect the failed scanner and aggregation steps."
              echo
              echo "[Detailed workflow artifacts]($ARTIFACT_URL)"
            } > reports/check-summary.md
          fi
          cat reports/check-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate consolidated PR comment
        if: always()
        env:
          PYTHONPATH: src
          TRUSTGATE_REPOSITORY: ${{ github.repository }}
          TRUSTGATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ -f reports/findings.json ] && [ -f reports/policy-result.json ]; then
            comment_args=()
            if [ -f reports/baseline-diff.json ]; then
              comment_args+=(--baseline-diff reports/baseline-diff.json)
            fi
            if [ -f reports/baseline-gate.json ]; then
              comment_args+=(--baseline-gate reports/baseline-gate.json)
            fi
            python -m trustgate pr-comment \
              --input reports/findings.json \
              --policy-result reports/policy-result.json \
              --repository "$TRUSTGATE_REPOSITORY" \
              --commit "$TRUSTGATE_COMMIT" \
              --artifact-url "$ARTIFACT_URL" \
              --dashboard-url "$DASHBOARD_URL" \
              --output reports/pr-comment.md \
              "${comment_args[@]}"
          else
            {
              printf '%s\n' '<!-- trustgate-pr-summary -->'
              printf '%s\n' '## Trust Gate' '' '**Release decision: ERROR**' ''
              printf '%s\n' 'Canonical findings or policy output was unavailable. Inspect the workflow artifacts.' ''
              printf '[Detailed workflow artifacts](%s)\n' "$ARTIFACT_URL"
            } > reports/pr-comment.md
          fi

      - name: Upload unified findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-findings
          path: |
            reports/findings.json
            reports/policy-result.json
            reports/trustgate.sarif
            reports/check-summary.md
            reports/pr-comment.md

      # Final enforcement — if the gate script failed, block the build here with a clear message
      - name: Enforce security gate result
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" == "failure" ]; then
            echo "Security gate failed — HIGH/CRITICAL findings detected. Blocking build."
            exit 1
          fi
          echo "Security gate passed."

  # This write-capable job never checks out or executes repository code. Fork
  # pull requests retain the SARIF artifact but cannot publish with a read-only
  # token. Same-repository PRs receive code annotations after publication.
  upload-sarif:
    name: Publish Trust Gate findings to code scanning
    needs: [security-gate]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Trust Gate SARIF artifact
        id: sarif-artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-findings
          path: reports/

      - name: Upload Trust Gate SARIF to code scanning
        if: >-
          steps.sarif-artifact.outcome == 'success' &&
          hashFiles('reports/trustgate.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: reports/trustgate.sarif
          category: trustgate

  # --- Dashboard Generator ---
  # Takes the unified findings and renders a nice HTML report so humans can actually
  # read the results without staring at raw JSON. Runs last, even if the gate failed,
  # so there's always a report to look at.
  generate-dashboard:
    name: Generate Report Dashboard
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download unified findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-findings
          path: reports/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Trust Gate runtime dependencies
        run: python -m pip install --require-hashes -r requirements/runtime.lock

      - name: Generate HTML dashboard
        run: python scripts/generate_report.py

      # Pages serves a directory, and we want the dashboard reachable at both the
      # bare site URL and an explicit /dashboard.html — so ship it as both files.
      - name: Prepare Pages site
        run: |
          mkdir -p pages_site
          cp reports/dashboard.html pages_site/index.html
          cp reports/dashboard.html pages_site/dashboard.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages_site

  # Publishing is isolated in a reusable workflow. The caller grants write
  # permissions only on trusted pushes after dashboard generation succeeds.
  publish-dashboard:
    name: Publish Dashboard to GitHub Pages
    needs: [generate-dashboard]
    if: github.event_name == 'push' && needs.generate-dashboard.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-dashboard.yml

  # This write-capable job never checks out or executes repository code. It
  # upserts only Trust Gate's marked, bot-owned summary so repeated runs cannot
  # flood the pull request or overwrite a human-authored lookalike comment.
  comment-pr-summary:
    name: Update Trust Gate PR summary
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download consolidated PR summary
        id: pr-comment-artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unified-findings
          path: reports/

      - name: Create or update consolidated PR summary
        if: >-
          steps.pr-comment-artifact.outcome == 'success' &&
          hashFiles('reports/pr-comment.md') != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- trustgate-pr-summary -->';
            const body = fs.readFileSync('reports/pr-comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('Refusing to publish an unmarked Trust Gate comment.');
              return;
            }
            if (Buffer.byteLength(body, 'utf8') >= 32768) {
              core.setFailed('Refusing to publish an oversized Trust Gate comment.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
