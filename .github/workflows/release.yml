name: Release Trust Gate

"on":
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release-policy:
    name: Require protected release environment
    if: github.repository == 'xkobxx/devsecops-dissertation'
    runs-on: ubuntu-latest
    steps:
      - name: Verify required reviewers are configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/environments/release" \
            > "$RUNNER_TEMP/release-environment.json"
          jq -e '
            any(
              .protection_rules[]?;
              .type == "required_reviewers"
              and (.reviewers | length) > 0
            )
          ' "$RUNNER_TEMP/release-environment.json"

  release:
    name: Build and sign release
    if: github.repository == 'xkobxx/devsecops-dissertation'
    needs: release-policy
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements/runtime.lock

      - name: Run release tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build archives, checksums and signatures
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_release.py \
            --ref "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --output release \
            --sign

      - name: Verify generated checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Generate build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release/trustgate-*.tar.gz
            release/trustgate-*.zip
          sbom-path: release/trustgate-${{ github.ref_name }}.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/trustgate-*.tar.gz \
            release/trustgate-*.zip \
            release/trustgate-*.cdx.json \
            release/SHA256SUMS \
            release/*.sigstore.json \
            --verify-tag \
            --title "Trust Gate $GITHUB_REF_NAME" \
            --generate-notes
