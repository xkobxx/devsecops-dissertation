[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate"
version = "0.1.0"
description = "A local-first application-security decision platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "David Mensah" },
]
dependencies = [
  "cryptography==49.0.0",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["trustgate.scoring*"]

[tool.setuptools.data-files]
"share/trustgate/schemas" = [
  "schemas/baseline.schema.json",
  "schemas/baseline-diff.schema.json",
  "schemas/baseline-gate.schema.json",
  "schemas/decision.schema.json",
  "schemas/finding.schema.json",
  "schemas/policy-result.schema.json",
  "schemas/policy.schema.json",
  "schemas/registry.json",
  "schemas/scan-run.schema.json",
  "schemas/suppression.schema.json",
]

[tool.setuptools.package-data]
"trustgate.policy.packs" = [
  "manifest.json",
  "README.md",
  "fixtures/*.json",
  "*/*.yml",
  "*/*.json",
  "*/*.md",
]

[tool.vercel]
entrypoint = "benchmarks.fixtures.python.flask_vulnerable.app:app"
